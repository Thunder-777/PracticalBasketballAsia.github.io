title: Asia Basketball Association
tagline: A 12-franchise Practical Basketball league, built for the hardwood
description: Official home of the Asia Basketball Association league — standings, rosters, stats, and news.
baseurl: "" # IMPORTANT: set this to "/your-repo-name" if this is NOT a username.github.io repo
url: ""     # IMPORTANT: set this to "https://yourusername.github.io"

season: "2026"
current_week: 1

collections:
  teams:
    output: true
    permalink: /teams/:slug/

defaults:
  - scope:
      path: ""
      type: "teams"
    values:
      layout: "team"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

markdown: kramdown
